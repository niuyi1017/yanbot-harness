<svg xmlns="http://www.w3.org/2000/svg" width="900" height="725" viewBox="0 0 1800 1450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 40px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #64748b; }
      .section { font: 700 24px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #1e3a8a; }
      .node-title { font: 700 22px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #0f172a; }
      .node-text { font: 400 17px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #475569; }
      .label { font: 700 16px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #334155; }
      .tiny { font: 400 15px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #475569; }
      .key-text { font: 700 16px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill: #92400e; }
      .process { fill: #ffffff; stroke: #475569; stroke-width: 2.5; filter: url(#shadow); }
      .spec { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .credential { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2.5; }
      .state { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .sdk-path { fill: #eff6ff; stroke: #3b82f6; stroke-width: 3; filter: url(#shadow); }
      .cli-path { fill: #fff7ed; stroke: #f59e0b; stroke-width: 3; filter: url(#shadow); }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .key-arrow { stroke: #d97706; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1450" fill="#f8fafc"/>
  <text x="900" y="54" text-anchor="middle" class="title">Yanbot Harness 双 Runtime × 双厂商接入架构</text>
  <text x="900" y="89" text-anchor="middle" class="subtitle">进程、协议、凭据和数据边界示意</text>

  <g transform="translate(592 1395)">
    <rect x="0" y="0" width="145" height="34" rx="9" class="process"/>
    <text x="72" y="23" text-anchor="middle" class="tiny">实线：进程/服务</text>
    <rect x="157" y="0" width="145" height="34" rx="9" class="spec"/>
    <text x="230" y="23" text-anchor="middle" class="tiny">虚线：协议/规范</text>
    <rect x="314" y="0" width="145" height="34" rx="9" class="credential"/>
    <text x="386" y="23" text-anchor="middle" class="tiny">橙色：凭据/Key</text>
    <rect x="471" y="0" width="145" height="34" rx="9" class="state"/>
    <text x="543" y="23" text-anchor="middle" class="tiny">灰色：数据/状态</text>
  </g>

  <rect x="420" y="120" width="960" height="82" rx="18" class="process"/>
  <text x="900" y="153" text-anchor="middle" class="node-title">产品进程：业务系统 / 我们的 CLI / Web / Electron</text>
  <text x="900" y="181" text-anchor="middle" class="node-text">只调用 @yanbot-harness/sdk，不直接调用厂商 SDK 或厂商 CLI</text>

  <path d="M900 202 L900 228" class="arrow"/>
  <rect x="520" y="228" width="760" height="70" rx="16" class="spec"/>
  <text x="900" y="257" text-anchor="middle" class="node-title">Harness Client Protocol（客户端协议规范）</text>
  <text x="900" y="282" text-anchor="middle" class="node-text">HTTP/HTTPS + SSE：Session / Run / Event / Interaction</text>

  <text x="900" y="340" text-anchor="middle" class="section">① 选择 Runtime 在哪里运行</text>
  <path d="M900 298 L900 355 L450 355 L450 386" class="arrow"/>
  <path d="M900 355 L1350 355 L1350 386" class="arrow"/>

  <rect x="55" y="386" width="790" height="360" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
  <text x="450" y="424" text-anchor="middle" class="node-title">Local Runtime 区域（用户 Mac / Windows）</text>

  <rect x="105" y="450" width="440" height="100" rx="16" class="process"/>
  <text x="325" y="486" text-anchor="middle" class="node-title">Local Runtime［独立进程］</text>
  <text x="325" y="516" text-anchor="middle" class="node-text">loopback 服务；管理本机工作区和运行状态</text>
  <text x="325" y="539" text-anchor="middle" class="tiny">内部运行 Harness Core、SDK Adapter 或 Sidecar Supervisor</text>

  <rect x="585" y="450" width="210" height="100" rx="16" class="credential"/>
  <text x="690" y="481" text-anchor="middle" class="key-text">Local Access Token</text>
  <text x="690" y="509" text-anchor="middle" class="tiny">保护本机Runtime接口</text>
  <text x="690" y="534" text-anchor="middle" class="tiny">通过descriptor交给SDK</text>
  <path d="M585 500 L545 500" class="key-arrow"/>

  <rect x="105" y="580" width="300" height="112" rx="16" class="credential"/>
  <text x="255" y="613" text-anchor="middle" class="key-text">CodeBuddy Key［厂商凭据］</text>
  <text x="255" y="641" text-anchor="middle" class="tiny">测试方修改受保护Key文件</text>
  <text x="255" y="667" text-anchor="middle" class="tiny">只有Runtime/Adapter读取</text>
  <path d="M255 580 L255 550" class="key-arrow"/>

  <rect x="445" y="580" width="350" height="112" rx="16" class="state"/>
  <text x="620" y="613" text-anchor="middle" class="label">本机工作区 + 本地状态</text>
  <text x="620" y="641" text-anchor="middle" class="tiny">路径授权 Workspace Grant</text>
  <text x="620" y="667" text-anchor="middle" class="tiny">Session元数据 + JSONL事件日志</text>
  <path d="M620 580 L430 550" class="arrow"/>

  <rect x="955" y="386" width="790" height="360" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
  <text x="1350" y="424" text-anchor="middle" class="node-title">Remote Runtime 区域（远端服务器）</text>

  <rect x="1005" y="450" width="330" height="100" rx="16" class="process"/>
  <text x="1170" y="486" text-anchor="middle" class="node-title">Remote API［服务进程］</text>
  <text x="1170" y="516" text-anchor="middle" class="node-text">HTTPS、用户认证、租户隔离</text>
  <text x="1170" y="539" text-anchor="middle" class="tiny">接收Run；本身不直接执行Agent</text>

  <rect x="1375" y="450" width="320" height="100" rx="16" class="credential"/>
  <text x="1535" y="481" text-anchor="middle" class="key-text">Platform Access Token</text>
  <text x="1535" y="509" text-anchor="middle" class="tiny">用户/设备短期访问令牌</text>
  <text x="1535" y="534" text-anchor="middle" class="tiny">SDK持有；不等于厂商Key</text>
  <path d="M1375 500 L1335 500" class="key-arrow"/>

  <rect x="1005" y="580" width="280" height="112" rx="16" class="state"/>
  <text x="1145" y="613" text-anchor="middle" class="label">Queue + Event Store</text>
  <text x="1145" y="641" text-anchor="middle" class="tiny">队列、Session/Run状态</text>
  <text x="1145" y="667" text-anchor="middle" class="tiny">事件持久化与断线重放</text>
  <path d="M1170 550 L1145 580" class="arrow"/>

  <rect x="1325" y="580" width="370" height="112" rx="16" class="process"/>
  <text x="1510" y="613" text-anchor="middle" class="node-title">Worker + Sandbox［进程/容器］</text>
  <text x="1510" y="641" text-anchor="middle" class="tiny">领取Run，在隔离工作区执行Adapter</text>
  <text x="1510" y="667" text-anchor="middle" class="tiny">长期Key不进入客户端或Queue正文</text>
  <path d="M1285 636 L1325 636" class="arrow"/>

  <rect x="1325" y="706" width="370" height="64" rx="16" class="credential"/>
  <text x="1510" y="733" text-anchor="middle" class="key-text">CodeBuddy Key / 短期厂商凭据</text>
  <text x="1510" y="756" text-anchor="middle" class="tiny">服务端保管，按Run注入Worker/Sandbox</text>
  <path d="M1510 706 L1510 692" class="key-arrow"/>

  <rect x="420" y="790" width="960" height="80" rx="18" class="spec"/>
  <text x="900" y="822" text-anchor="middle" class="node-title">Harness Contracts + Adapter API［规范 + 公共代码接口］</text>
  <text x="900" y="851" text-anchor="middle" class="node-text">Local Runtime和Remote Worker都遵守；不是单独运行的进程</text>
  <path d="M450 746 L450 765 L730 765 L730 790" class="arrow"/>
  <path d="M1350 746 L1350 765 L1070 765 L1070 790" class="arrow"/>

  <text x="900" y="920" text-anchor="middle" class="section">② 选择厂商通过 SDK 还是 CLI 接入</text>
  <path d="M900 870 L900 935 L445 935 L445 965" class="arrow"/>
  <path d="M900 935 L1355 935 L1355 965" class="arrow"/>

  <rect x="70" y="965" width="750" height="320" rx="24" class="sdk-path"/>
  <text x="445" y="1005" text-anchor="middle" class="node-title">SDK 厂商模式：不需要 Wrapper</text>

  <rect x="120" y="1035" width="280" height="90" rx="15" class="state"/>
  <text x="260" y="1068" text-anchor="middle" class="label">SDK Adapter［代码库］</text>
  <text x="260" y="1095" text-anchor="middle" class="tiny">运行在Runtime/Worker进程内</text>
  <text x="260" y="1117" text-anchor="middle" class="tiny">不是独立进程</text>

  <rect x="490" y="1035" width="280" height="90" rx="15" class="state"/>
  <text x="630" y="1068" text-anchor="middle" class="label">厂商 SDK［代码库］</text>
  <text x="630" y="1095" text-anchor="middle" class="tiny">例如WorkBuddy/CodeBuddy SDK</text>
  <text x="630" y="1117" text-anchor="middle" class="tiny">由SDK Adapter直接调用</text>
  <path d="M400 1080 L490 1080" class="arrow"/>

  <rect x="175" y="1160" width="540" height="76" rx="15" class="credential"/>
  <text x="445" y="1190" text-anchor="middle" class="key-text">CodeBuddy Key只注入这一侧的Runtime/Adapter</text>
  <text x="445" y="1217" text-anchor="middle" class="tiny">产品SDK、产品CLI、Web、Electron都不读取厂商Key</text>

  <rect x="980" y="965" width="750" height="320" rx="24" class="cli-path"/>
  <text x="1355" y="1005" text-anchor="middle" class="node-title">CLI 厂商模式：需要 Wrapper</text>

  <rect x="1020" y="1035" width="205" height="90" rx="15" class="state"/>
  <text x="1122" y="1068" text-anchor="middle" class="label">Sidecar Supervisor</text>
  <text x="1122" y="1095" text-anchor="middle" class="tiny">在Runtime/Worker内</text>
  <text x="1122" y="1117" text-anchor="middle" class="tiny">负责监管独立进程</text>

  <rect x="1260" y="1023" width="190" height="114" rx="15" class="process"/>
  <text x="1355" y="1058" text-anchor="middle" class="label">Vendor Wrapper</text>
  <text x="1355" y="1085" text-anchor="middle" class="tiny">［独立进程］</text>
  <text x="1355" y="1110" text-anchor="middle" class="tiny">翻译协议+管理CLI</text>

  <rect x="1485" y="1035" width="205" height="90" rx="15" class="process"/>
  <text x="1587" y="1068" text-anchor="middle" class="label">厂商 CLI</text>
  <text x="1587" y="1095" text-anchor="middle" class="tiny">［Wrapper子进程］</text>
  <text x="1587" y="1117" text-anchor="middle" class="tiny">如Claude Code CLI</text>

  <path d="M1225 1080 L1260 1080" class="arrow"/>
  <rect x="1212" y="1148" width="286" height="54" rx="13" class="spec"/>
  <text x="1355" y="1171" text-anchor="middle" class="label">Sidecar Protocol［规范］</text>
  <text x="1355" y="1193" text-anchor="middle" class="tiny">JSON-RPC 2.0 + JSONL</text>
  <path d="M1450 1080 L1485 1080" class="arrow"/>
  <text x="1468" y="1058" text-anchor="middle" class="tiny">argv/pipes</text>

  <rect x="1090" y="1225" width="530" height="40" rx="14" fill="#ffedd5"/>
  <text x="1355" y="1252" text-anchor="middle" class="key-text">Wrapper只用于CLI模式；每个厂商有自己的翻译实现</text>

  <rect x="270" y="1320" width="1260" height="55" rx="18" fill="#e2e8f0"/>
  <text x="900" y="1345" text-anchor="middle" class="node-title">最终四种组合共用同一套上层调用</text>
  <text x="900" y="1367" text-anchor="middle" class="tiny">Local+SDK ｜ Local+CLI ｜ Remote+SDK ｜ Remote+CLI</text>
</svg>
