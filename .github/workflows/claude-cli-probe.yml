name: Claude CLI experimental probe
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-credentials:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2022
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false
      - uses: ./.github/actions/msvc
        if: runner.os == 'Windows'
      - run: node scripts/build-native-host.mjs native-build
        if: runner.os == 'Windows'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @yanbot-harness/adapter-claude-code-cli test:unit
      - run: node scripts/probe-claude-code-platform.mjs evidence
        env:
          HARNESS_CLI_JOB_HOST: ${{ github.workspace }}/native-build/cli-job-host.exe
      - uses: actions/upload-artifact@v7
        with:
          name: claude-cli-${{ matrix.target }}
          path: evidence/claude-code-*.json
          if-no-files-found: error
          retention-days: 14
