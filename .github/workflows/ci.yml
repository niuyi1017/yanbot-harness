name: CI

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
