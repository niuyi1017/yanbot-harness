name: Native containment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-job:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - uses: ./.github/actions/msvc
      - run: node scripts/build-native-host.mjs native-build
      - run: node scripts/test-native-job-host.mjs native-build/managed-job-host.exe
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/probe-managed-containment.mjs
        env:
          HARNESS_NATIVE_JOB_HOST: native-build/managed-job-host.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-job-containment
          path: native-build/*.json
          if-no-files-found: warn
