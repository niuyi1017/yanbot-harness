name: Distribution mechanism probes

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-fixtures:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - run: npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
      - run: pnpm probe:distribution --export-kit "${{ runner.temp }}/transfer-kit" --output-dir "${{ runner.temp }}/distribution-probes"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-transfer-fixtures
          path: ${{ runner.temp }}/transfer-kit
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distribution-probe-producer
          path: ${{ runner.temp }}/distribution-probes/*/report.json
          if-no-files-found: warn
          retention-days: 14
  packaging:
    needs: transfer-fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2022
            target: win32-x64
          - runner: ubuntu-24.04
            target: linux-x64
    name: Package mechanisms (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/msvc
        if: runner.os == 'Windows'
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - run: npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:probes
      - uses: actions/download-artifact@v8
        with:
          name: distribution-transfer-fixtures
          path: ${{ runner.temp }}/transfer-kit
      - run: pnpm probe:distribution --import-kit "${{ runner.temp }}/transfer-kit" --output-dir "${{ runner.temp }}/distribution-probes"
      - run: pnpm probe:runtime-archive --output-dir "${{ runner.temp }}/distribution-probes"
      - run: pnpm --filter @yanbot-harness/runtime test:unit
      - run: pnpm --filter @yanbot-harness/sdk test:unit
      - run: pnpm build:platform-runtime --test-signing --skip-build --output-dir "${{ runner.temp }}/platform-builds"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platform-candidate-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/platform-builds/*/build-report.json
            ${{ runner.temp }}/platform-builds/*/*.tgz
            ${{ runner.temp }}/platform-builds/*/test-trust.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distribution-probe-${{ matrix.target }}
          path: ${{ runner.temp }}/distribution-probes/*/report.json
          if-no-files-found: warn
          retention-days: 14
