name: Remote Mongo persistence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica-set:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./.github/actions/mongo-replica-set
      - name: Real transaction, index and model broker conformance
        env:
          HARNESS_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=harness-ci&directConnection=true
        run: pnpm --filter @yanbot-harness/cloud-server exec vitest run test/mongo.integration.test.ts test/model-broker-core.test.ts test/model-broker-http.test.ts --reporter=default --reporter=json --outputFile=../../evidence/mongo-conformance.json
      - name: Require actual tests with no skips
        run: node -e 'const r=JSON.parse(require("fs").readFileSync("evidence/mongo-conformance.json"));if(!r.success||r.numPassedTests<28||r.numPendingTests||r.numFailedTests)process.exit(1)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: remote-mongo-persistence
          path: evidence/*
          if-no-files-found: error
      - name: Remove only the dedicated test container
        if: always()
        run: docker rm --force harness-mongo-ci
