name: Remote sandbox containment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build immutable test images from official Node
        run: |
          docker pull node:22.22.0-bookworm-slim
          base=$(docker image inspect --format '{{index .RepoDigests 0}}' node:22.22.0-bookworm-slim)
          docker build -f containers/sandbox/Dockerfile --build-arg NODE_BASE="$base" -t harness-sandbox-test .
          docker build -f containers/sandbox/Dockerfile --build-arg NODE_BASE="$base" --build-arg REFERENCE_WAIT=1 -t harness-sandbox-wait .
          docker build -f containers/sandbox/Dockerfile --build-arg NODE_BASE="$base" --build-arg WITH_CLAUDE=1 -t harness-sandbox-claude .
          echo "HARNESS_SANDBOX_CLAUDE_IMAGE=$(docker image inspect --format '{{.Id}}' harness-sandbox-claude)" >> "$GITHUB_ENV"
          echo "HARNESS_SANDBOX_IMAGE=$(docker image inspect --format '{{.Id}}' harness-sandbox-test)" >> "$GITHUB_ENV"
          echo "HARNESS_SANDBOX_WAIT_IMAGE=$(docker image inspect --format '{{.Id}}' harness-sandbox-wait)" >> "$GITHUB_ENV"
      - run: node scripts/probe-remote-sandbox.mjs evidence
      - name: Install Redis for full Worker path
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - uses: ./.github/actions/mongo-replica-set
      - run: pnpm --filter @yanbot-harness/cloud-server exec vitest run test/remote-worker.e2e.test.ts --reporter=default --reporter=json --outputFile=../../evidence/remote-worker-e2e.json
      - name: Require complete Worker and model bridge evidence
        run: node -e 'const r=JSON.parse(require("fs").readFileSync("evidence/remote-worker-e2e.json"));if(!r.success||r.numPassedTests<15||r.numPendingTests||r.numFailedTests)process.exit(1)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: remote-sandbox-containment
          path: evidence/*
          if-no-files-found: error
      - name: Remove the dedicated Mongo test container
        if: always()
        run: docker rm --force harness-mongo-ci
