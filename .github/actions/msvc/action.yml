name: Installed MSVC x64 environment
description: Load only compiler environment variables from the runner's existing toolchain
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (!$installation) { throw 'MSVC toolchain is required.' }
        $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
        cmd /d /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set PATH && set INCLUDE && set LIB" | ForEach-Object {
          $pair = $_ -split '=', 2
          if ($pair.Length -eq 2 -and $pair[0] -match '^(PATH|INCLUDE|LIB|LIBPATH)$') {
            "$($pair[0])=$($pair[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
        if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed.' }
